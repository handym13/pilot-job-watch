name: Pilot job watch

on:
  schedule:
    # Fast poll: hot sources only, roughly every 20 minutes.
    # GitHub queues scheduled runs, so treat this as "about every 20 to 45 min".
    - cron: "*/20 * * * *"
    # Full sweep plus the research pass, once daily at 07:00 Hawaii time.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run a full sweep"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FULL_SWEEP: ${{ github.event.schedule == '0 17 * * *' && '1' || inputs.full && '1' || '' }}
        run: python digest.py

      - name: Publish
        run: |
          git config user.name  "job-agent"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add -A
          git diff --staged --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%M)"
          git push
